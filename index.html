  <button style="visibility: hidden" disabled onclick="location.href = 'TicTacToe/ttt.html'" class="gameButton">

      <form class="w3-container" id="reg_fo">

        <br>
        <input placeholder="Phone number" id="phoneNumber_in"></input>
        <br>
        <input placeholder="Age" id="age_in"></input>
        <br>
        <input placeholder="User name" id="userName_in"></input>
        <br>
      </form>
      <button id="submitReg" onclick=submit()>Done!!!!</button>
    </div>
  </div>
