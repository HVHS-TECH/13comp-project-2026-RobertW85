<!doctype html>
<html>

<head>
  <title>Tic Tac Toe</title>
  <!--P5 Play-->
</head>

<body>
  <link rel="stylesheet" href="ttt_style.css" />
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">

  <div id="endScreen_di" style="visibility: hidden">
    <h1 id="endGameHeader_h1" style="text-align: center">Player... wins!</h1>
    <div style="display: flex; justify-content: center">
      <button id="leave_bt" style="font-size: 20px; padding: 2vh">Leave</button>
      <button id="rematch_bt" style="font-size: 20px; padding: 2vh">Rematch</button>
    </div>
  </div>

  <div id="leaderBoard_di" class="w3-modal">
    <div class="w3-modal-content w3-card-4">
      <header class="w3-container w3-gray">
        <h2>Leaderboard</h2>
      </header>
      <table class="w3-container" id="leaderBoardContent_tb"></table>
    </div>
  </div>

</body>
<script src="https://q5js.org/q5.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/addons/p5.sound.js"

  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://p5play.org/v3/planck.min.js"></script>
<script src="https://p5play.org/v3/p5play.js"></script>
<script id="lobby_scr" type="module" src="ttt_lobby.mjs"></script>

</html>
